const aliases={rep:['rep','rep_name','name','employee_name','sdr_name'],period:['period','week','date','week_start'],opportunities:['opportunities_created'],pipeline:['pipeline_created'],revenue:['revenue_booked'],qa:['qa_score']};
let saved;try{saved=JSON.parse(localStorage.getItem('zevian_findings_prototype_v1'))}catch{}

let stage=0,selected=null,mode='upload',draftNote='',editingContext=null;

function formatDate(value){if(!value)return 'Date unavailable';const date=new Date(value);return Number.isNaN(date.getTime())?String(value):new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(date)}
function formatTimestamp(value){const date=new Date(value);return Number.isNaN(date.getTime())?'Date unavailable':new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZoneName:'short'}).format(date)}
function plural(count,noun){return count+' '+noun+(count===1?'':'s')}
function statusLabel(status){return ({needs_context:'Ready for review',diagnosis_created:'Explanation ready',monitoring:'Marked for monitoring',dismissed:'Dismissed',known_issue:'Known issue',explained:'Explained',action_recorded:'Action saved',waiting_for_data:'Waiting for new data'})[status]||'Ready for review'}
function persist(){try{localStorage.setItem('zevian_findings_prototype_v1',JSON.stringify(state));return true}catch{notify('Browser storage is unavailable. This review is kept only while the page is open.');return false}}
function notify(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.add('hidden'),4000)}
function render(html,nextMode,nextStage){mode=nextMode;stage=nextStage;$('screen').innerHTML=html;$('crumb').textContent='Weekly SDR review / '+({upload:'Upload data',mapping:'Match columns',patterns:'Review findings',ask:'Ask Zevian',detail:selected?.rep||'Rep review',diagnosis:'Choose next action',history:'Decision history',processing:'Compare performance'}[mode]);$('steps').innerHTML=['Upload data','Match columns','Review findings','Save decisions'].map((s,i)=>'<li class="step '+(i===stage?'current':i<stage?'done':'')+'" '+(i===stage?'aria-current="step"':'')+'><span>'+(i+1)+'</span>'+s+'</li>').join('');$('steps').classList.toggle('hidden',['history','ask'].includes(mode));$('askNav').classList.toggle('active',mode==='ask');$('reviewNav').classList.toggle('active',!['history','ask'].includes(mode));$('historyNav').classList.toggle('active',mode==='history');$('screen').focus({preventScroll:true});window.scrollTo(0,0)}
function button(text,fn,primary=false){return '<button class="btn '+(primary?'primary':'')+'" data-action="'+fn+'">'+text+'</button>'}
function uploadScreen(){render('<h1>Upload weekly performance data</h1><p class="lede">Upload a weekly export for your sales development reps (SDRs) from your CRM, dialer, or spreadsheet.</p><div class="upload" id="dropzone"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 22V5m-6 6 6-6 6 6M5 21v6h22v-6"/></svg><p class="muted">Drop a CSV or XLSX file here. Maximum size: 10 MB.</p><input class="hidden" type="file" id="file" accept=".csv,.xlsx"><div class="actions">'+button('Choose a file','choose',true)+button('Try sample data','sample')+'</div></div><div id="uploadError" role="alert"></div><details class="help"><summary>What to include</summary><p>Include a rep name, a reporting date, and at least one performance metric. Use one row per rep per week. Add up to 4 earlier weeks to compare with recent performance.</p><p>You can also import other numeric columns as custom metrics. Only the first sheet of an XLSX file is read.</p><a href="sample-sdr-performance.csv" download>Download sample CSV</a></details>'+(state.patterns.length?'<div class="actions">'+button('Resume saved review','patterns')+'</div>':''),'upload',0);$('file').onchange=e=>readFile(e.target.files[0]);const d=$('dropzone');['dragenter','dragover'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(x=>d.addEventListener(x,e=>{e.preventDefault();d.classList.remove('drag')}));d.ondrop=e=>readFile(e.dataTransfer.files[0])}
async function readFile(file){if(!file)return;try{if(!/\.(csv|xlsx)$/i.test(file.name))throw Error('Choose a CSV or XLSX file.');if(file.size>10*1024*1024)throw Error('This file is larger than 10 MB. Upload a smaller export.');if(!window.XLSX)throw Error('The spreadsheet reader did not load. Reload the page and try again.');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});prepare(file.name,rows,false,wb.SheetNames[0])}catch(e){$('uploadError').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function prepare(name,rows,sample,sheet=''){rows=rows.filter(r=>r.some(v=>String(v).trim()));if(rows.length<2)throw Error('No performance rows found. Include a header row and at least one data row.');const columns=rows[0].map(v=>String(v).trim());if(columns.some(v=>!v)||new Set(columns).size!==columns.length)throw Error('Each column needs a unique, non-empty header. Fix the header row and upload again.');state.patterns=[];state.records=[];state.upload={id:crypto.randomUUID(),file:name,sample,sheet,date:new Date().toISOString(),mappingStatus:'needs_review'};state.columns=columns;state.rows=rows.slice(1);state.mapping=columns.map(source=>{const n=source.toLowerCase().replace(/[ -]/g,'_');const field=Object.keys(fields).find(k=>k===n||(aliases[k]||[]).includes(n));return {source,field:field||'custom',confidence:field?'Suggested match':'Check this column',confirmed:false}});mappingScreen()}
function sample(){const rows=[['Rep name','Week','Calls','Connect rate','Meetings booked','Pipeline created']];['Aaron M.','Nina Patel','Leo Chen','Maya Reed'].forEach((rep,i)=>{for(let w=0;w<5;w++)rows.push([rep,['2026-08-18','2026-08-25','2026-09-01','2026-09-08','2026-09-15'][w],[400,380,420,360][i],[18,20,19,21][i]-(w===4?[2,0,0,1][i]:0),w===4?[19,24,26,22][i]:[25,24,26,23][i],w===4?[34000,32000,42000,35000][i]:[40000,39000,42000,36000][i]])});prepare('sample-sdr-performance.csv',rows,true)}
function mappingScreen(){render('<h1>Match your columns</h1><p class="lede">'+esc(state.upload.file)+' Â· '+plural(state.rows.length,'data row')+(state.upload.sheet?' Â· Sheet: '+esc(state.upload.sheet):'')+'. Check how each column will be used before comparing performance.</p><div class="table-wrap panel"><table><thead><tr><th>Source column</th><th>Sample value</th><th>Import as</th><th>Match status</th></tr></thead><tbody>'+state.mapping.map((m,i)=>'<tr><td>'+esc(m.source)+'</td><td>'+esc(state.rows[0][i])+'</td><td><select aria-label="Import column '+esc(m.source)+'" data-map="'+i+'">'+Object.entries({...fields,custom:'Custom metric',ignore:'Do not import'}).map(([v,t])=>'<option value="'+v+'" '+(v===m.field?'selected':'')+'>'+t+'</option>').join('')+'</select></td><td>'+m.confidence+'</td></tr>').join('')+'</tbody></table></div><details class="help"><summary>Missing a rep name or reporting date?</summary><p class="muted">Enter a shared value only when the corresponding column is missing and the value applies to every row. Otherwise, update the source file and upload it again.</p><div class="form-grid"><div><label for="fallbackRep">Rep name for all rows</label><input id="fallbackRep"></div><div><label for="fallbackPeriod">Reporting date for all rows</label><input type="date" id="fallbackPeriod"></div></div></details><div id="mappingError" role="alert"></div><div class="actions">'+button('Choose another file','upload')+button('Confirm matches and compare','detect',true)+'</div>','mapping',1);document.querySelectorAll('[data-map]').forEach(el=>el.onchange=()=>state.mapping[+el.dataset.map].field=el.value)}
const number=v=>{const s=String(v).trim().replace(/[$Â£â‚¬,%\s]/g,'');return s!==''&&Number.isFinite(Number(s))?Number(s):null};
function detect(){try{const mapped=state.mapping.filter(m=>!['custom','ignore'].includes(m.field)).map(m=>m.field);if(new Set(mapped).size!==mapped.length)throw Error('A field is mapped more than once. Choose a different field for each source column.');const repIndex=state.mapping.findIndex(m=>m.field==='rep'),periodIndex=state.mapping.findIndex(m=>m.field==='period'),fallbackRep=$('fallbackRep').value.trim(),fallbackPeriod=$('fallbackPeriod').value;const metrics=state.mapping.map((m,i)=>({key:m.field==='custom'?m.source:m.field,index:i})).filter(m=>!['rep','period','ignore'].includes(m.key));if(repIndex<0&&!fallbackRep)throw Error('Match a column to Rep name, or enter a rep name for all rows.');if(periodIndex<0&&!fallbackPeriod)throw Error('Match a column to Reporting date, or enter a reporting date for all rows.');if(!metrics.length)throw Error('Choose at least one numeric column to import as a performance metric.');const seen=new Set();state.records=state.rows.map((row,i)=>{const rep=String(repIndex<0?fallbackRep:row[repIndex]).trim(),period=String(periodIndex<0?fallbackPeriod:row[periodIndex]).trim(),stamp=Date.parse(period);if(!rep||!Number.isFinite(stamp))throw Error('Row '+(i+2)+' needs a rep name and a valid date (for example, 2026-09-15).');const key=rep+'|'+stamp;if(seen.has(key))throw Error('Multiple rows for '+rep+' in the same period. Combine them into one weekly record before uploading.');seen.add(key);return {rep,period:new Date(stamp).toISOString().slice(0,10),metrics:Object.fromEntries(metrics.map(m=>[m.key,number(row[m.index])])),uploadId:state.upload.id}});if(!state.records.some(r=>Object.values(r.metrics).some(v=>v!==null)))throw Error('No numeric performance values were found. Check your column matches and the values in the source file.');state.mapping.forEach(m=>m.confirmed=true);state.upload.mappingStatus='confirmed';render('<div class="panel progress" role="status"><h1>Comparing performance</h1><p class="lede">Comparing each rep with their recent performance and the rest of the team.</p><div class="pulse"></div></div>','processing',2);setTimeout(()=>{buildPatterns();persist();patternsScreen()},650)}catch(e){$('mappingError').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null,delta=(v,b)=>b?100*(v-b)/b:null,fmt=v=>Number(v.toFixed(1)).toLocaleString('en-GB'),pct=v=>(v>0?'+':'')+fmt(v)+'%';
function buildPatterns(){state.patterns=[];const reps=[...new Set(state.records.map(r=>r.rep))],latest=state.records.map(r=>r.period).sort().at(-1);state.upload.period=latest;state.baselineLimited=false;state.noBaseline=0;reps.forEach(rep=>{const records=state.records.filter(r=>r.rep===rep).sort((a,b)=>a.period.localeCompare(b.period));const current=records.at(-1);if(current.period!==latest)return;const prior=records.slice(0,-1).slice(-4);if(prior.length<4)state.baselineLimited=true;if(!prior.length){state.noBaseline++;return}const evidence=Object.keys(current.metrics).map(metric=>{const values=prior.map(r=>r.metrics[metric]).filter(v=>v!==null),baseline=avg(values),value=current.metrics[metric],change=value!==null&&baseline!==null?delta(value,baseline):null;const changes=reps.filter(n=>n!==rep).map(n=>{const rr=state.records.filter(r=>r.rep===n).sort((a,b)=>a.period.localeCompare(b.period)),c=rr.at(-1),b=avg(rr.slice(0,-1).slice(-4).map(r=>r.metrics[metric]).filter(v=>v!==null));return c?.period===latest&&c.metrics[metric]!==null&&b!==null?delta(c.metrics[metric],b):null}).filter(v=>v!==null);return {metric,value,baseline,change,periods:values.length,previous:records.at(-2)?.metrics[metric],team:avg(changes)}});const candidates=evidence.filter(e=>e.change!==null&&(e.metric==='no_shows'||e.metric==='cancellations'?e.change>=20:e.change<=-15)).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));if(!candidates.length)return;const signal=candidates[0],conversion=['connect_rate','reply_rate','meetings_booked','meetings_held','opportunities','pipeline','revenue'].includes(signal.metric),large=Math.abs(signal.change)>=25;const type=['connect_rate','connects'].includes(signal.metric)?'connect':['reply_rate','emails'].includes(signal.metric)?'reply':['pipeline','opportunities','revenue'].includes(signal.metric)?'pipeline':'meeting';state.patterns.push({id:crypto.randomUUID(),rep,period:latest,signal,evidence,type,severity:large&&conversion&&signal.periods>=3?'High priority':conversion||large?'Needs review':'Monitor',status:'needs_context',contexts:[],diagnosis:null})});state.patterns.sort((a,b)=>Math.abs(b.signal.change)-Math.abs(a.signal.change))}
function metric(p,key){return p.evidence.find(e=>e.metric===key&&e.change!==null)}
function activityStable(p){const e=metric(p,'calls');return !!e&&Math.abs(e.change)<=5}
function changeSummary(p){const e=p.signal;return (fields[e.metric]||e.metric)+' '+(e.change<0?'fell ':'increased ')+fmt(Math.abs(e.change))+'% compared with the average of '+plural(e.periods,'earlier period')+'.'}
function supportingObservations(p){const related={meetings_booked:['pipeline','connect_rate','calls','reply_rate','emails','meetings_held','opportunities'],meetings_held:['meetings_booked','no_shows','cancellations','pipeline','calls'],pipeline:['meetings_booked','meetings_held','opportunities','connect_rate','calls'],opportunities:['meetings_booked','meetings_held','pipeline','calls'],revenue:['pipeline','opportunities','meetings_held'],connect_rate:['calls','connects','meetings_booked','pipeline','emails'],connects:['calls','connect_rate','meetings_booked','pipeline'],reply_rate:['emails','meetings_booked','pipeline','calls'],calls:['connect_rate','connects','meetings_booked','pipeline'],emails:['reply_rate','meetings_booked','pipeline'],no_shows:['meetings_booked','meetings_held','cancellations','pipeline'],cancellations:['meetings_booked','meetings_held','no_shows','pipeline']};const keys=related[p.signal.metric]||p.evidence.filter(e=>e.metric!==p.signal.metric).sort((a,b)=>Math.abs(b.change||0)-Math.abs(a.change||0)).map(e=>e.metric);return keys.map(key=>metric(p,key)).filter(e=>e&&e.metric!==p.signal.metric).slice(0,4).map(e=>{const label=fields[e.metric]||e.metric;const movement=e.change===0?'stayed flat':(e.change<0?'fell ':'rose ')+fmt(Math.abs(e.change))+'%';return label+' '+movement+(e.periods!==p.signal.periods?' compared with the average of '+plural(e.periods,'earlier period'):'')+'.'}).join(' ')}
function observationSummary(p){const supporting=supportingObservations(p);return changeSummary(p)+(supporting?' '+supporting:'')}
function interpretation(p){let text=observationSummary(p);if(activityStable(p))text+=' Activity volume is unlikely to be the main issue.';else {const calls=metric(p,'calls');if(calls&&calls.change<=-10)text+=' Check activity and conversion together.';}return text}
function missingSignals(p){return p.type==='pipeline'?['Qualification notes','AE feedback','Handoff changes','Rep self-report','Manager observation']:p.type==='connect'?['Recent call notes','Phone data or dialer issues','Lead source / territory changes','Rep self-report','Manager observation']:p.type==='reply'?['Recent email samples','Sequence or messaging changes','Deliverability or audience changes','Rep self-report','Manager observation']:['Recent call notes','Sequence or messaging changes','Lead source / territory changes','Rep self-report','Manager observation']}
// Local demo classifier: explicit wording suggests categories, not verified causes.
const contextRules=[{tag:'Segment change',re:/\b(segment|territory|fintech|new audience|new market|new icp)\b/i},{tag:'Messaging / sequence issue',re:/\b(sequence|messaging|message|offer|email copy|call script|script)\b/i},{tag:'Possible lead quality issue',re:/\b(lead quality|lead source|lead list|wrong contact|bad timing|timing was bad|unqualified|poor leads)\b/i},{tag:'Call notes',re:/\b(call notes|call recording|calls reviewed|heard on|said on the call)\b/i},{tag:'Rep self-report',re:/\b(he (also )?(mentioned|said|reported)|she (also )?(mentioned|said|reported)|rep (said|reported)|self.report|i (was|had|noticed))\b/i},{tag:'Tool / deliverability issue',re:/\b(dialer|outage|bounced|deliverability|phone data|tool issue)\b/i},{tag:'Qualification / handoff issue',re:/\b(qualification|handoff|ae feedback|opportunity quality)\b/i}];
function classifyContext(content){const sentences=content.split(/(?<=[.!?])\s+|\n/).filter(Boolean);return contextRules.map(rule=>{const quotes=sentences.filter(t=>rule.re.test(t)&&!(/\b(no|without)\b.{0,20}\b(change|issue|problem)\b|\b(unchanged|stayed the same)\b/i.test(t)));return quotes.length?{tag:rule.tag,quote:quotes.join(' ')}:null}).filter(Boolean)}
function contextTags(c){return c.tags||[c.type||'Unclassified context']}

function weeklyReviewScreen(){
 if(state.upload?.mappingStatus==='confirmed')return patternsScreen();
 const needsMapping=!!state.upload;
 render('<h1>Weekly review</h1><p class="lede">Review performance changes and choose the next action for each rep.</p><div class="panel" style="margin-top:28px"><h2>'+(needsMapping?'Finish preparing your data':'Start your weekly review')+'</h2><p class="muted">'+(needsMapping?'Your file is uploaded. Confirm the column matches to see performance changes.':'Upload weekly performance data to see changes that need review, or explore the sample data.')+'</p><div class="actions">'+(needsMapping?button('Continue matching columns','mapping',true)+button('Choose another file','upload'):button('Upload weekly data','upload',true)+button('Try sample data','sample'))+'</div></div>','patterns',needsMapping?1:0);
 if(!needsMapping)$('steps').classList.add('hidden');
}
function findingTitle(p){const label=fields[p.signal.metric]||p.signal.metric,calls=metric(p,'calls');return label+(p.signal.change<0?' dropped':' increased')+(calls&&calls.change>5&&p.signal.metric!=='calls'?' after call volume increased':'')}
function findingContext(p){return '<div class="row-context hidden" id="context-'+p.id+'">'+(p.contexts.length?'<div class="context-chips" aria-label="Zevian found possible context">'+p.contexts.map(c=>'<details class="context-suggestion" name="suggestion-'+p.id+'"><summary>'+esc((c.relevance==='accepted'?'Using: ':c.relevance==='ignored'?'Ignored: ':'Suggested: ')+(contextTags(c).join(', ')||'Manager note'))+'</summary><p>'+esc(c.content)+'</p><p>Zevian linked this to:</p><ul>'+contextLinks(p,c).map(e=>'<li>'+esc(fields[e.metric])+(e.change<0?' drop':' increase')+'</li>').join('')+'</ul><p class="muted">Possible links based on this note and the available metrics.</p><p>Does this help explain the finding?</p><div class="actions">'+button('Yes, use it','relevance:'+p.id+':'+c.id+':accepted')+button('No, ignore','relevance:'+p.id+':'+c.id+':ignored')+'</div></details>').join('')+'</div>':'<p class="muted context-help">Add context to help Zevian judge this fairly.</p>')+inlineContextForm(p)+'</div>'}
function contextLinks(p,c){const tags=contextTags(c).join(' '),keys=/sequence|Messaging|script/i.test(tags)?['connect_rate','reply_rate','meetings_booked']: /lead|Segment/i.test(tags)?['connect_rate','reply_rate','meetings_booked','pipeline']:/Tool/i.test(tags)?['calls','connect_rate','reply_rate']: /handoff/i.test(tags)?['meetings_held','opportunities','pipeline']: [p.signal.metric];return p.evidence.filter(e=>keys.includes(e.metric)&&e.change!==null&&e.change!==0).slice(0,3)}
function inlineContextForm(p){const id=p.id;return '<h3>Add context</h3><label for="note-'+id+'">What happened that may explain this change?</label><textarea id="note-'+id+'" placeholder="We changed the call script on Tuesday."></textarea><label for="type-'+id+'">Optional type</label><select id="type-'+id+'"><option value="">Let Zevian categorize it</option>'+['Operational change','Coaching note','Market/lead quality','Other'].map(t=>'<option>'+t+'</option>').join('')+'</select><div id="error-'+id+'" role="alert"></div><div class="actions">'+button('Save context','inlineSave:'+id,true)+'</div>'}
function findingPriority(p){const change=Math.abs(p.signal.change),weak=p.signal.periods<3;return weak||change<18?'Low':change>=25?'High':'Medium'}
function findingReasoning(p){const e=p.signal,related=p.evidence.filter(x=>x.metric!==e.metric&&x.change!==null).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change))[0];let text=(fields[e.metric]||e.metric)+' '+(e.change<0?'fell':'rose')+' from '+fmt(e.baseline)+(e.metric.endsWith('_rate')?'%':'')+' to '+fmt(e.value)+(e.metric.endsWith('_rate')?'%':'')+'.';if(related)text+=' '+(fields[related.metric]||related.metric)+' '+(related.change<0?'fell':'increased')+' '+fmt(Math.abs(related.change))+'%.';return text}

'</div></div>').join(''):'<p class="muted">No notes saved yet. Add notes or a rep response to help explain this change.</p>')+(diagnosis?'<div class="actions">'+button('Add context','edit')+'</div>':'')+'</details></section><section class="section"><details><summary>Decision history</summary>'+historyHTML(state.history.filter(h=>h.patternId===p.id))+'</details></section></div><aside class="panel detail-side">'+(diagnosis?decisionForm(p):'<h2>Context to check</h2><ul class="signal-list">'+missingSignals(p).map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><details class="support"><summary>Continue without notes</summary><p>You can review an explanation now, but the cause may remain unclear without supporting notes.</p>'+button('Review explanation','diagnose')+'</details>')+'</aside></div>',diagnosis?'diagnosis':'detail',diagnosis?3:2);if(!diagnosis){$('contextNote').value=draftNote;$('contextNote').oninput=()=>draftNote=$('contextNote').value}}
function contextPrompt(p){if(p.type==='pipeline')return 'Add notes about qualification, feedback from the account executive (AE), or handoffs. You can also continue without notes.';if(p.type==='reply')return 'Add notes about sequence changes, audience changes, or email delivery. You can also continue without notes.';if(p.type==='connect')return 'Add notes about lead lists, call timing, phone data, or dialer issues. You can also continue without notes.';return 'Add notes about lead or messaging changes, or what the rep noticed. You can also continue without notes.'}

function buildDiagnosis(p){
 const usable=p.contexts.filter(c=>!c.relevance||c.relevance==='accepted');const previous=p.diagnosis||{},tags=[...new Set(usable.flatMap(c=>c.tags||[]))],notes=usable.map(c=>c.content).join(' ');
 const segment=tags.includes('Segment change'),sequence=tags.includes('Messaging / sequence issue'),lead=tags.includes('Possible lead quality issue'),tool=tags.includes('Tool / deliverability issue'),handoff=tags.includes('Qualification / handoff issue');
 const drop=key=>{const e=metric(p,key);return !!e&&e.change<0},rise=key=>{const e=metric(p,key);return !!e&&e.change>0};
 const conversionDrop=['connect_rate','reply_rate','meetings_booked','meetings_held','opportunities'].some(drop),pipelineDrop=['pipeline','revenue'].some(drop),calls=metric(p,'calls'),reply=metric(p,'reply_rate');
 const timing=/bad timing|timing was bad|poor timing|not (ready|a good time)|timing objections/i.test(notes),lowerReplies=/fewer replies|lower replies|less replies|getting fewer|reply rate.{0,15}(fell|drop)/i.test(notes);
 const conflict=lowerReplies&&reply&&reply.change>0;
 let explanation,uncertainty,suggestion,aligned=false;
 if(segment&&sequence){
  aligned=conversionDrop;
  explanation=conversionDrop?'The new segment and sequence are plausible contributors to the conversion drop.':'The notes describe segment and sequence changes, but the available metrics do not yet show a matching conversion drop.';
  uncertainty='Both changes are mentioned in the notes. Their separate effects have not been checked, so we cannot tell whether the audience, messaging, or both contributed.';
  suggestion='Compare reply and connect rates for the old and new segment and sequence. Review 3 unsuccessful conversations for audience fit'+(timing?' and timing objections.':'.');
 }else if(segment||lead){
  aligned=conversionDrop;
  explanation=conversionDrop?'The audience or lead source may have become harder to reach or convert. The notes describe a change in leads, which is consistent with the conversion decline.':'The change in leads is a possible factor, but it has not been linked to the affected outcome.';
  uncertainty='We have not compared results by lead segment or source. The notes alone cannot establish that lead quality caused the drop.';
  suggestion='Compare connect and meeting rates by old and new lead segment or source. Review 3 unsuccessful conversations for audience fit'+(timing?' and timing objections.':'.');
 }else if(sequence){
  aligned=conversionDrop;
  explanation=conversionDrop?'The sequence or messaging change may be reducing response quality. A change in approach is described in the notes and is consistent with weaker conversion.':'The sequence change is a hypothesis, but a matching response or conversion decline has not been established.';
  uncertainty='Results have not been separated by sequence. Audience changes, delivery problems, or timing could also explain the difference.';
  suggestion='Compare reply and meeting rates for the old and new sequence within the same audience. Review 3 unanswered emails for message fit and delivery issues.';
 }else if(tool){
  aligned=drop('connect_rate')||drop('reply_rate')||drop('connects');
  explanation=aligned?'The reported tool or delivery issue may be reducing successful contact. This fits the weaker contact or reply signal.':'The notes mention a tool issue, but its impact on the measured outcome is not yet established.';
  uncertainty='The affected dates and reps have not been matched to tool logs. A reported issue does not establish the size of its impact.';
  suggestion='Match the affected period with dialer or delivery logs, then compare contact rates before and after the issue. Review 3 affected calls/emails.';
 }else if(handoff){
  aligned=pipelineDrop||drop('opportunities');
  explanation=aligned?'Problems with qualification or handoffs may be limiting the output from meetings. The notes point to a process issue that could affect opportunity creation.':'The qualification or handoff concern needs to be checked against opportunity outcomes before treating it as an explanation.';
  uncertainty='We have not traced recent meetings through qualification and AE acceptance. Lead fit and handoff quality remain separate possibilities.';
  suggestion='Trace 3 recent meetings through qualification and AE acceptance. Ask the AE where each handoff stalled and whether lead fit or missing information was the blocker.';
 }else{
  explanation=usable.length?'The notes do not yet distinguish a lead, messaging, tool, or process explanation. There is not enough specific evidence to choose a likely cause.':'The performance data identifies a change, but it does not establish a cause. Notes or a rep response may help explain it.';
  uncertainty='No specific explanation has been connected to supporting records.';
  suggestion=p.type==='pipeline'?'Trace 3 recent meetings into opportunity outcomes and request AE feedback on qualification and handoff.':'Review 3 recent calls/emails and ask the rep whether leads, messaging, tools, or workload changed in this period.';
 }
 if(aligned&&!conflict){if(timing&&lowerReplies)explanation+=' The notes mention poor timing and fewer replies, which supports checking audience fit and messaging first.';else if(timing)explanation+=' Reported timing objections make audience readiness worth checking.';else if(lowerReplies)explanation+=' Reported fewer replies make the sequence comparison especially useful.';}
 if(calls&&Math.abs(calls.change)<=5&&conversionDrop)explanation+=' Relatively stable call volume makes reduced calling activity a less likely explanation.';
 else if(calls&&calls.change<-5)uncertainty+=' Calling activity also declined, so volume and conversion effects need to be separated.';
 if(conflict){explanation+=' However, the note about fewer replies conflicts with the uploaded reply rate, which rose.';uncertainty='Check whether the notes and reply-rate data cover the same audience, dates, and definition before relying on the messaging hypothesis.';suggestion='Reconcile the reported reply decline with the uploaded reply rate by period, audience, and sequence. Then review 3 email samples.';}
 const confidence=p.signal.periods>=4&&aligned&&!conflict?'Medium':'Low';
 return {id:previous.id||crypto.randomUUID(),reasoningVersion:2,summary:changeSummary(p),explanation,uncertainty,missing:uncertainty,confidence,confidenceReason:confidence==='Medium'?'The notes and measured conversion or output signal agree, but the proposed cause still needs a comparison or record review.':conflict?'The notes and data disagree. Check that they cover the same dates and audience.':p.signal.periods<4?'The baseline is limited. More periods and supporting records are needed.':'The notes have not been linked to a matching performance change.',suggestion,decision:previous.decision||null,nextAction:previous.nextAction||null};
}

function historyHTML(items){return items.length?[...items].reverse().map(h=>'<div class="history-item"><time>'+formatTimestamp(h.date)+' - '+esc(h.author)+'</time><strong>'+esc(h.rep)+' - '+esc(h.action)+'</strong>'+(h.categories?'<div class="muted">'+esc(h.categories.join(', '))+'</div>':'')+'<p>'+esc(h.note)+'</p><span class="muted">Reporting date: '+esc(formatDate(h.period))+'</span><details style="margin-top:8px"><summary>Evidence saved with this decision</summary><p class="muted" style="margin-top:10px">'+esc(h.sourceFile||'')+'</p><ul class="evidence">'+(h.evidence||[]).filter(e=>e.value!==null&&e.baseline!==null).map(e=>'<li><span>'+esc(fields[e.metric]||e.metric)+'</span><strong>'+fmt(e.baseline)+' to '+fmt(e.value)+'</strong></li>').join('')+'</ul>'+(h.context||[]).map(c=>'<p>'+esc(c.type)+': '+esc(c.content)+'</p>').join('')+(h.explanation?'<p>'+esc(h.explanation)+'</p>':'')+'</details></div>').join(''):'<p class="muted" style="margin-top:16px">No decisions saved yet. Review a performance change to save your first decision.</p>'}
function historyScreen(){render('<div class="review-head"><div><h1>Decision history</h1><p class="lede">Review past manager actions and their supporting evidence.</p></div></div><div class="panel">'+historyHTML(state.history)+'</div>','history',3)}
function saveDecision(){const p=selected,d=p.diagnosis,text=(editAction.active?$('nextStepText').value:d.nextAction?.text||d.suggestion).trim();if(!text){$('nextStepError').innerHTML='<p class="error">Write a next step, or cancel the edit to use the recommendation.</p>';$('nextStepText').focus();return}const categories=classifyNextAction(text);d.nextAction={text,categories,source:editAction.active?'manager':'recommendation',date:new Date().toISOString()};d.decision=categories.join(', ');p.status=categories.includes('Mark as explained')?'explained':categories.includes('Monitor next period')?'monitoring':'action_recorded';record(p,'Next action saved',text);Object.assign(state.history.at(-1),{categories:[...categories],actionSource:d.nextAction.source});editAction.active=false;const stored=persist();detailScreen(p.id,true);notify(stored?'Next action saved.':'Next action recorded for this session.');if(allReviewed())askScreen();else $('screen').insertAdjacentHTML('beforeend','<div class="actions">'+button('Review next change','next',true)+'</div>')}

function isReviewed(p){return !!p.diagnosis?.nextAction||['monitoring','dismissed','known_issue','explained','action_recorded'].includes(p.status)}
function allReviewed(){return state.upload?.mappingStatus==='confirmed'&&state.patterns.every(isReviewed)}
function pendingPatterns(){return state.patterns.filter(p=>!isReviewed(p))}
function scheduleReview(id){const p=state.patterns.find(p=>p.id===id);if(!p)return;if(!p.nextReview){p.nextReview={period:new Date(Date.parse(p.period)+7*86400000).toISOString().slice(0,10),status:'waiting_for_data'};record(p,'Review next period',formatDate(p.nextReview.period)+' - Waiting for new data. This prototype does not compare new uploads automatically.');persist()}if(allReviewed())askScreen();else patternsScreen();notify('Follow-up date saved: '+formatDate(p.nextReview.period)+'. Upload new data to review performance again.')}
function currentChat(){const id=state.upload?.id||null;if(!state.chat||state.chat.uploadId!==id)state.chat={uploadId:id,messages:[],repIds:[]};return state.chat}
function chatHTML(){return currentChat().messages.map(m=>'<article class="chat-message '+m.role+'"><span class="chat-speaker">'+(m.role==='user'?'You':'Zevian')+'</span><div class="chat-copy">'+(m.role==='user'?'<p>'+esc(m.text)+'</p>':m.html)+'</div></article>').join('')}
function askScreen(){const chat=currentChat();render('<h1>Ask Zevian</h1><p class="lede">Ask about performance changes, supporting evidence, or saved actions. You can also ask follow-up questions.</p><div class="conversation"><div class="chat-thread" id="chatThread" role="log" aria-label="Conversation with Zevian" aria-live="polite">'+chatHTML()+'</div><div id="chatStarters" class="suggestions '+(chat.messages.length?'hidden':'')+'"><button class="suggestion" data-question="What needs review?">What needs review?</button><button class="suggestion" data-question="What actions were saved?">What actions were saved?</button>'+(!state.upload?button('Try sample data','sample'):'')+'</div><div class="chat-composer"><label class="sr-only" for="askInput">Ask Zevian a question or follow up</label><textarea id="askInput" rows="2" placeholder="Ask a question or follow up..."></textarea>'+button('Ask Zevian','askQuestion',true)+'</div></div>','ask',0);$('askInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askQuestion()}}}
function answerQuestion(q){const chat=currentChat(),lower=q.toLowerCase();if(!state.upload)return '<p>Upload performance data using the sidebar, or try the sample data, so I can answer from your records.</p>';if(state.upload.mappingStatus!=='confirmed')return '<p>Confirm your column matches and compare performance before asking about this upload.</p>'+button('Match columns','mapping');const named=state.patterns.filter(p=>lower.includes(p.rep.toLowerCase())||lower.includes(p.rep.split(' ')[0].toLowerCase()));const team=/\b(team|everyone|all reps|all cards)\b|what needs review/i.test(q);const followup=/\b(he|she|they|him|her|them|that|this|those|these|his|their|why|evidence|confidence|unclear)\b|what (should|do) i|what next|what context|what action/i.test(q);let scope=named.length?named:!team&&followup&&chat.repIds.length?state.patterns.filter(p=>chat.repIds.includes(p.id)):[];if(team)scope=[];const patterns=scope.length?scope:state.patterns;
 if(/\b(evidence|source|sources|support|supports|supporting)\b/i.test(q)){chat.repIds=patterns.map(p=>p.id);return patterns.length?patterns.map(p=>'<h3>'+esc(p.rep)+'</h3><ul class="evidence">'+p.evidence.filter(e=>e.value!==null&&e.baseline!==null).map(e=>'<li><span>'+esc(fields[e.metric]||e.metric)+'</span><strong>'+fmt(e.baseline)+' to '+fmt(e.value)+(e.change!==null?' ('+pct(e.change)+')':'')+'</strong></li>').join('')+'</ul><p>'+ (p.contexts.length?'The notes provide context, but do not prove the cause.':'No notes have been added yet.')+'</p>').join(''):'<p>No changes met the review thresholds in this upload, so there is no change evidence to review.</p>'}
 if(/\b(confidence|unclear|certain|sure)\b/i.test(q)){chat.repIds=patterns.map(p=>p.id);return patterns.map(p=>'<h3>'+esc(p.rep)+'</h3><p>'+esc(p.diagnosis?p.diagnosis.confidence+' confidence. '+p.diagnosis.confidenceReason:'The cause is still unclear. Open this review to add notes or review an explanation.')+'</p>'+(p.diagnosis?'<p>'+esc(p.diagnosis.uncertainty)+'</p>':'')).join('')||'<p>No explanation is available yet. Open a performance review to add notes or review an explanation.</p>'}
 if(/\b(context|notes|note)\b/i.test(q)&&!/next|action|should|request/i.test(q)){chat.repIds=patterns.map(p=>p.id);return patterns.map(p=>'<h3>'+esc(p.rep)+'</h3>'+ (p.contexts.length?p.contexts.map(c=>'<p class="raw-context">'+esc(c.content)+'</p>').join(''):'<p>No notes have been added yet.</p>')).join('')||'<p>No notes have been added yet.</p>'}
 if(/what (should|do) i|what next|next step|recommend|check next/i.test(q)){chat.repIds=patterns.map(p=>p.id);return patterns.map(p=>'<h3>'+esc(p.rep)+'</h3><p>'+esc(p.diagnosis?.nextAction?.text||p.diagnosis?.suggestion||'Add notes about '+missingSignals(p).slice(0,3).join(', ').toLowerCase()+' to narrow the likely explanation.')+'</p>'+button('Open review','open:'+p.id)).join('')||'<p>No changes in this upload need further review. Upload the data for the next week when it is ready.</p>'}
 if(/\b(action|actions|decision|decisions|recorded|saved|follow.up)\b|next week/i.test(q)){const history=state.history.filter(h=>(h.action==='Next action saved'||h.action==='Review next period')&&(!scope.length||scope.some(p=>p.id===h.patternId)));return history.length?history.slice(-6).map(h=>'<p><strong>'+esc(h.rep)+':</strong> '+esc(h.note)+'</p>').join(''):'<p>No saved actions match this question. Open a performance review to save a next action.</p>'}
 if(scope.length){chat.repIds=scope.map(p=>p.id);return scope.map(p=>'<h3>'+esc(p.rep)+'</h3><p>'+esc(p.diagnosis?.explanation||interpretation(p))+'</p>'+(p.diagnosis&&/why|explain/i.test(q)?'<p>'+esc(p.diagnosis.uncertainty)+'</p>':'')+button('Open review','open:'+p.id)).join('')}
 if(/review|change|risk|priority|summary|summarize/i.test(q)){const pending=pendingPatterns();chat.repIds=pending.map(p=>p.id);return pending.length?pending.map(p=>'<h3>'+esc(p.rep)+' needs review</h3><p>'+esc(interpretation(p))+'</p>'+button('Review change','open:'+p.id)).join(''):'<p>All flagged changes in this upload have been reviewed. Ask about saved actions or name a rep to explore their review.</p>'}
 return '<p>I can help with the changes, notes, evidence, and actions in this upload. Name a rep, or ask &ldquo;What evidence supports that?&rdquo;</p>'}
function askQuestion(){const q=$('askInput').value.trim();if(!q){$('askInput').focus();return}const chat=currentChat(),html=answerQuestion(q),scope=state.patterns.filter(p=>chat.repIds.includes(p.id));const source=state.upload?.mappingStatus==='confirmed'?'<details class="support"><summary>Sources</summary><p>'+esc(state.upload.file)+' - '+esc(formatDate(state.upload.period))+'</p><p>'+esc(scope.length?scope.map(p=>p.rep).join(', '):'Uploaded records and decision history')+'</p><p>This prototype answers from records saved in this browser using fixed rules.</p></details>':'';chat.messages.push({role:'user',text:q},{role:'assistant',html:html+source});persist();$('chatThread').innerHTML=chatHTML();$('chatStarters').classList.add('hidden');$('askInput').value='';$('askInput').focus();$('chatThread').lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function migrateSavedDemo(){if(!state.upload?.sample||state.upload.demoVersion===2)return;const old=state.patterns;const nina=state.records.find(r=>r.rep==='Nina Patel'&&r.period===state.upload.period);if(nina&&!old.some(p=>p.rep==='Nina Patel')){nina.metrics.pipeline=32000;const rep=state.mapping.findIndex(m=>m.field==='rep'),period=state.mapping.findIndex(m=>m.field==='period'),pipeline=state.mapping.findIndex(m=>m.field==='pipeline');state.rows.forEach(row=>{if(row[rep]==='Nina Patel'&&row[period]===nina.period&&pipeline>=0)row[pipeline]=32000});buildPatterns();state.patterns=state.patterns.map(p=>{const prior=old.find(o=>o.rep===p.rep&&o.signal.metric===p.signal.metric);return prior?{...p,id:prior.id,status:prior.status,contexts:prior.contexts,diagnosis:prior.diagnosis,nextReview:prior.nextReview}:p})}state.upload.demoVersion=2;persist()}
const actions={ask:askScreen,askQuestion,upload:uploadScreen,choose:()=>$('file').click(),sample,mapping:mappingScreen,detect,patterns:patternsScreen,context:addContext,editAction,cancelActionEdit,request:requestContext,diagnose,save:saveDecision,history:historyScreen,resume:weeklyReviewScreen,edit:()=>{editingContext=null;draftNote='';detailScreen(selected.id)},copy:async()=>{try{await navigator.clipboard.writeText(requestContext.prompt);notify('Request copied. Send it to your rep when you are ready.')}catch{notify('Could not copy the request. Select the request text and copy it manually.')}},next:()=>{const next=pendingPatterns().find(p=>p.id!==selected?.id);if(next)detailScreen(next.id,!!next.diagnosis);else askScreen()}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const [action,a,b,c]=el.dataset.action.split(':');if(action==='menu')return;if(action==='drawer'){openFindingDrawer(a)}else if(action==='closeDrawer'){closeFindingDrawer()}else if(action==='drawerContext'){closeFindingDrawer();toggleFindingPanel(a,'context')}else if(action==='drawerRequest'){const p=state.patterns.find(p=>p.id===a);closeFindingDrawer();selected=p;requestContext()}else if(action==='inlineSave'){saveInlineContext(a)}else if(action==='toggleContext'){toggleFindingPanel(a,'context')}else if(action==='toggleDetails'){toggleFindingPanel(a,'details')}else if(action==='employee'){notify('Employee profile for '+state.patterns.find(p=>p.id===a).rep+' is not available in this prototype.')}else if(action==='relevance'){confirmContext(a,b,c)}else if(action==='followup'){followUp(a)}else if(action==='schedule'){scheduleReview(a)}else if(action==='contextEdit'){const c=selected.contexts.find(c=>c.id===a);editingContext=c.id;draftNote=c.content;detailScreen(selected.id);$('contextNote').focus()}else if(action==='open'){editingContext=null;draftNote='';const p=state.patterns.find(p=>p.id===a);detailScreen(a,!!p?.diagnosis)}else if(action==='quick'){const p=state.patterns.find(p=>p.id===b);p.status=a;record(p,statusLabel(a));persist();refreshFinding(b);notify('Decision saved in history.')}else actions[action]?.()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('findingDrawer'))closeFindingDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('finding-row')){e.preventDefault();openFindingDrawer(e.target.id.replace('finding-',''))}});
$('uploadNav').onclick=uploadScreen;$('askNav').onclick=askScreen;$('reviewNav').onclick=actions.resume;$('historyNav').onclick=historyScreen;document.addEventListener('click',e=>{const item=e.target.closest('[data-question]');if(item){$('askInput').value=item.dataset.question;askQuestion()}});
